name: Android Debug APK

# Compila el APK de prueba (debug) en la nube de GitHub, que SÍ tiene acceso a
# Google (el contenedor de desarrollo lo tiene bloqueado). El APK queda como
# "artifact" descargable desde la pestaña Actions. Es un APK debug (sin firmar
# para Play Store) — sirve para instalar y probar en tu teléfono.

on:
  workflow_dispatch: {}        # botón "Run workflow" en la pestaña Actions
  push:
    branches:
      - claude/wizardly-thompson-c2YDO
    paths-ignore:
      - '**.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36 + aceptar licencias
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platforms;android-36"

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Vite)
        run: npm run build
        env:
          # Configura estos secrets en el repo: Settings -> Secrets and variables
          # -> Actions -> New repository secret. Si faltan, el APK compila igual
          # pero sin Supabase (la app cae a localStorage).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync (copia web + plugins a android/)
        run: npx cap sync android

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: booty-alarm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
